[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-ja-wakeword"
version = "0.1.0"
description = "Ultra-tiny (~629 KB INT8), noise-robust, open-vocabulary streaming Japanese wake-word detector"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["wake-word", "keyword-spotting", "japanese", "onnx", "edge-ai", "streaming", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "kaldi-native-fbank>=1.20",
    "numpy>=1.24",
    "onnxruntime>=1.18",
    "soxr>=0.3",
]

[project.scripts]
tiny-ja-wakeword-demo = "tiny_ja_wakeword.demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiny_ja_wakeword = ["models/*.onnx", "demo/*.html"]
